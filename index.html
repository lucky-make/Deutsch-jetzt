<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Deutsch Jetzt! — learn German A1 to B2, one daily episode at a time.">
<meta name="theme-color" content="#0f766e">
<title>Deutsch Jetzt! — A1 → B2, one day at a time</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">DJ</span>
    <div>
      <h1>Deutsch Jetzt!</h1>
      <p class="tagline">A1 → B2 · one episode a day</p>
    </div>
  </div>
  <div class="streak-pill" id="streakPill" title="Day streak">
    <span class="flame" aria-hidden="true">&#9733;</span>
    <span id="streakCount">0</span>
  </div>
</header>

<nav class="tabbar" role="tablist" aria-label="Main navigation">
  <button class="tab active" data-view="today" role="tab" aria-selected="true">Today</button>
  <button class="tab" data-view="review" role="tab" aria-selected="false">Review <span class="badge" id="dueBadge">0</span></button>
  <button class="tab" data-view="progress" role="tab" aria-selected="false">Progress</button>
  <button class="tab" data-view="calendar" role="tab" aria-selected="false">Calendar</button>
</nav>

<main id="app" aria-live="polite">
  <!-- views rendered here -->
</main>

<!-- Exercise session overlay -->
<div class="overlay hidden" id="sessionOverlay" role="dialog" aria-modal="true" aria-labelledby="sessionTitle">
  <div class="session-card">
    <div class="session-top">
      <span id="sessionTitle" class="session-type">Exercise</span>
      <div class="session-progress"><div class="session-progress-bar" id="sessionBar"></div></div>
      <button class="icon-btn" id="quitSession" aria-label="Quit session">&#10005;</button>
    </div>
    <div id="sessionBody" class="session-body"></div>
    <div id="sessionFeedback" class="session-feedback" aria-live="polite"></div>
    <div class="session-actions" id="sessionActions"></div>
  </div>
</div>

<div class="toast hidden" id="toast" role="status"></div>

<script src="data/lessons.js"></script>
<script src="data/lessons_2.js"></script>
<script src="js/storage.js"></script>
<script src="js/srs.js"></script>
<script src="js/audio.js"></script>
<script src="js/exercises.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
