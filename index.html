<script>
(function(){

    +'@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}'
    +'@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}'
    +'@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}'
    +'@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.4)}50%{box-shadow:0 0 0 10px rgba(217,119,6,0)}}'
    +'@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}'
    +'.pop{animation:pop .25s ease}.shake{animation:shake .4s ease}.fadeUp{animation:fadeUp .4s ease both}'
    +'.opt-btn{transition:transform .12s ease,background .15s ease,border-color .15s ease,color .15s ease}'
    +'.opt-btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}'
    +'.opt-btn:active:not(:disabled){transform:scale(.97)}'
    +'.opt-btn:disabled{cursor:default}'
    +'.mission-card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;cursor:pointer}'
    +'.mission-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}'
    +'.speak-btn{transition:transform .12s ease,background .15s ease}'
    +'.speak-btn:hover{transform:scale(1.1);background:var(--accent-soft)}'
    +'.newbest{animation:pulseGlow 1.6s ease infinite}'
    +'.wave-bar{display:inline-block;width:4px;margin:0 2px;border-radius:2px;background:var(--teal);animation:wave 1s ease-in-out infinite}'
    +'.law-chip{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:8px;}'
    +'input[type=text]{outline:none;transition:border-color .15s ease,box-shadow .15s ease}'
    +'input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}'
    +'.stat-bar{height:10px;border-radius:6px;overflow:hidden;background:rgba(128,128,128,.1);}'
    +'.stat-fill{height:100%;border-radius:6px;transition:width .6s ease;}';
  document.head.appendChild(s);
})();
</script>

  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function pick(arr,n){ return shuffle(arr.slice()).slice(0,n); }
  function norm(s){ return (s||'').toLowerCase().trim().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[.?!,;:"]/g,'').replace(/\s+/g,' '); }
  var ARTICLE_RE = /^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines)\s+/;
  function matches(answer, expected){
    var a = norm(answer), e = norm(expected);
    if(a === e) return true;
    if(!ARTICLE_RE.test(e)){ if(a.replace(ARTICLE_RE,'') === e) return true; }
    return false;
  }

    var cardCount = Object.keys(S.cards).length;
    var dueCount = dueCards().length;

    var bars = concepts.length ? concepts.map(function(c){
      var col = c.acc>=80 ? 'var(--good)' : c.acc>=60 ? 'var(--accent2)' : 'var(--bad)';
      return '<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span style="font-weight:600;">'+c.name+'</span><span style="font-weight:700;color:'+col+';font-variant-numeric:tabular-nums;">'+c.acc+'% <span style="color:var(--muted);font-weight:400;font-size:11px;">('+c.c+'/'+c.t+')</span></span></div>'
        +'<div class="stat-bar"><div class="stat-fill" style="width:'+c.acc+'%;background:'+col+';"></div></div></div>';
    }).join('') : '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0;">Do the Misch-Training mission to build stats.</div>';

    var weakest = concepts.length ? concepts[0] : null;

    app.innerHTML =
      '<div class="fadeUp" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">'
      +'<button id="backBtn" style="background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;padding:4px 0;">← Dashboard</button>'
      +'<h2 style="font-size:18px;font-weight:700;margin:0;">Statistik</h2><div style="width:60px;"></div></div>'

      +'<div class="fadeUp" style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">'
      +'<div style="flex:1 1 80px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;">'+overall+'%</div><div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);">Overall</div></div>'
      +'<div style="flex:1 1 80px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;">'+S.total.t+'</div><div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);">Answered</div></div>'
      +'<div style="flex:1 1 80px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;">'+cardCount+'</div><div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);">SM-2 cards</div></div>'
      +'<div style="flex:1 1 80px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums;">'+dueCount+'</div><div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);">Due today</div></div></div>'

      +(weakest ? '<div class="fadeUp" style="background:var(--bad-soft);border:1px solid var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:var(--bad);"><strong>Focus tip:</strong> '+weakest.name+' is your weakest area ('+weakest.acc+'%). Drill it in Misch-Training.</div>' : '')

      +'<div class="fadeUp" style="background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);">'
      +'<div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;">Accuracy by category</div>'
      + bars + '</div>';

    document.getElementById('backBtn').addEventListener('click', renderDashboard);
  }

  function startMission(key){ cur={key:key, idx:0, correct:0, xpEarned:0, answered:false, qStart:0, mistakes:[]}; renderQ(); }

  function renderQ(){
    clearTimer();
    cur.answered=false;
    var m=MISSIONS[cur.key];
    q=m.build();
    cur.qStart=Date.now();
    var pct=(cur.idx/m.count)*100;

    var promptBlock;
    if(q.img){
      promptBlock = '<img src="'+q.img+'" alt="card" onerror="this.style.display=\'none\'" style="width:100%;max-height:190px;object-fit:contain;border-radius:12px;margin-bottom:6px;background:var(--bg);"/>';
    } else if(q.isListen){
      promptBlock = '<button class="speak-btn" id="playListen" style="width:64px;height:64px;border-radius:50%;background:var(--teal-soft);border:2px solid var(--teal);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-bottom:6px;">'+spkSVG(26,'var(--teal)')+'</button>'
        +'<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Tap to replay</div>'
        +'<div style="height:18px;"><span class="wave-bar" style="height:12px;"></span><span class="wave-bar" style="height:16px;animation-delay:.15s;"></span><span class="wave-bar" style="height:10px;animation-delay:.3s;"></span><span class="wave-bar" style="height:16px;animation-delay:.45s;"></span><span class="wave-bar" style="height:12px;animation-delay:.6s;"></span></div>';
    } else {
      promptBlock = '<div style="font-size:26px;font-weight:700;line-height:1.25;margin-bottom:4px;word-break:break-word;">'+q.prompt+'</div>';
    }

    var answerArea;
    if(q.type==='mc'){
      answerArea='<div id="opts" style="display:flex;flex-direction:column;gap:9px;margin-bottom:12px;">'
        +q.options.map(function(opt,i){
          return '<button class="opt-btn" data-i="'+i+'" style="width:100%;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid var(--border);color:var(--text);font-family:inherit;font-size:15.5px;font-weight:500;cursor:pointer;text-align:left;">'
            +'<span style="display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:7px;background:'+m.soft+';color:'+m.color+';font-weight:700;font-size:12px;margin-right:10px;">'+String.fromCharCode(65+i)+'</span>'+opt+'</button>';
        }).join('')+'</div>';
    } else {
      answerArea='<div id="typewrap" style="margin-bottom:12px;">'
        +'<input id="typein" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type in German (cases matter!)" style="width:100%;padding:15px;border-radius:14px;border:2px solid var(--border);font-family:inherit;font-size:16px;color:var(--text);box-sizing:border-box;"/>'
        +'<button id="typesub" style="margin-top:9px;width:100%;padding:14px;border-radius:14px;background:'+m.color+';color:#fff;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Check</button></div>';
    }

    app.innerHTML=
      '<div class="fadeUp" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;">'
      +'<button id="backBtn" style="background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;padding:4px 0;">← Quit</button>'
      +'<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;">'+m.name+' · '+(cur.idx+1)+'/'+m.count+'</div>'
      +'<div style="font-size:12.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;">+'+cur.xpEarned+' XP</div></div>'
      +'<div style="height:5px;background:rgba(128,128,128,.1);border-radius:6px;overflow:hidden;margin-bottom:6px;"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,'+m.color+',var(--accent2));border-radius:6px;transition:width .4s ease;"></div></div>'
      +'<div id="timerbar" style="height:5px;background:rgba(128,128,128,.12);border-radius:6px;overflow:hidden;margin-bottom:16px;"><div id="timerfill" style="height:100%;width:100%;background:'+m.color+';border-radius:6px;"></div></div>'
      +'<div class="pop" style="background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 16px;text-align:center;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);border-top:4px solid '+m.color+';">'
      +'<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;">'+q.sub+' <span class="law-chip" style="background:'+m.soft+';color:'+m.color+';">'+(q.law||m.law)+'</span></div>'
      + promptBlock + '</div>'
      + answerArea
      +'<div id="feedback" style="min-height:60px;"></div>';

    document.getElementById('backBtn').addEventListener('click', renderDashboard);
    if(q.isListen){ document.getElementById('playListen').addEventListener('click', function(e){ e.stopPropagation(); speak(q.speakText); }); setTimeout(function(){ speak(q.speakText); }, 450); }
    if(q.type==='mc'){
      app.querySelectorAll('.opt-btn').forEach(function(b){ b.addEventListener('click', function(){ resolve(q.options[parseInt(b.getAttribute('data-i'),10)], false); }); });
    } else {
      var inp=document.getElementById('typein');
      setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 80);
      var sub=function(){ if(!cur.answered) resolve(inp.value, false); };
      document.getElementById('typesub').addEventListener('click', sub);
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); sub(); } });
    }
    startTimer();
  }

  function startTimer(){
    var fill=document.getElementById('timerfill');
    timerId=setInterval(function(){
      var left=CONFIG.TIME_LIMIT-(Date.now()-cur.qStart);
      if(!fill){ clearTimer(); return; }
      if(left<=0){ clearTimer(); if(fill) fill.style.width='0%'; resolve(null,true); return; }
      var pct=(left/CONFIG.TIME_LIMIT)*100; fill.style.width=pct+'%';
      fill.style.background = left<6000?'var(--bad)':left<11000?'var(--accent2)':MISSIONS[cur.key].color;
    },120);
  }

  function resolve(chosen, timedOut){
    if(cur.answered) return;
    cur.answered=true; clearTimer();
    var elapsed=Date.now()-cur.qStart;
    var m=MISSIONS[cur.key];
    var correct = timedOut?false:(q.type==='type'? matches(chosen, q.correct) : chosen===q.correct);

    S.total.t++; if(correct) S.total.c++;
    if(q.concept){ if(!S.stats[q.concept]) S.stats[q.concept]={c:0,t:0}; S.stats[q.concept].t++; if(correct) S.stats[q.concept].c++; }

    if(q.type==='mc'){
      var btns=app.querySelectorAll('.opt-btn');
      btns.forEach(function(b,idx){
        b.disabled=true; var opt=q.options[idx];
        if(opt===q.correct){ b.style.background='var(--accent-soft)'; b.style.borderColor='var(--good)'; b.style.color='var(--good)'; }
        else if(!correct && opt===chosen){ b.style.background='var(--bad-soft)'; b.style.borderColor='var(--bad)'; b.style.color='var(--bad)'; b.classList.add('shake'); }
        else b.style.opacity='.45';
      });
    } else {
      var inp=document.getElementById('typein');
      if(inp){ inp.disabled=true; document.getElementById('typesub').disabled=true;
        if(correct){ inp.style.borderColor='var(--good)'; inp.style.background='var(--accent-soft)'; }
        else { inp.style.borderColor='var(--bad)'; inp.style.background='var(--bad-soft)'; inp.classList.add('shake'); } }
    }

    var fb=document.getElementById('feedback');
    var ivNote = '';
    if(correct){
      cur.correct++;
      var speed=(elapsed<6000)?3:0;
      var gain=m.base+speed; cur.xpEarned+=gain;
      sndCorrect();
      if(q.cardKey){ var iv=gradeCard(q.cardKey, q.recap.correct, 4); ivNote=' <span style="color:var(--good);">· next review in '+iv+'d</span>'; }
      fb.innerHTML='<div class="fadeUp" style="background:var(--accent-soft);border:1px solid var(--good);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;">'
        +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="3" style="flex-shrink:0;"><path d="M20 6L9 17l-5-5"/></svg>'
        +'<div style="flex:1;min-width:0;text-align:left;"><div style="font-weight:700;color:var(--good);font-size:14px;">Richtig! +'+gain+' XP'+(speed?' · speed':'')+ivNote+'</div>'
        +'<div style="color:var(--muted);font-size:12px;margin-top:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span>'+q.explain+'</span><button class="speak-btn" id="speakF" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;">'+spkSVG(12)+'</button></div></div></div>';
    } else {
      cur.mistakes.push(q.recap);
      sndWrong();
      var iv2=gradeCard(q.recap.q, q.recap.correct, 2);
      fb.innerHTML='<div class="fadeUp" style="background:var(--bad-soft);border:1px solid var(--bad);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;">'
        +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="3" style="flex-shrink:0;"><path d="M18 6L6 18M6 6l12 12"/></svg>'
        +'<div style="flex:1;min-width:0;text-align:left;"><div style="font-weight:700;color:var(--bad);font-size:14px;">'+(timedOut?'Zeit abgelaufen':'Falsch')+' · SM-2: review in '+iv2+'d</div>'
        +'<div style="color:var(--muted);font-size:12px;margin-top:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span>Correct: <strong style="color:var(--text);">'+q.correct+'</strong> — '+q.explain+'</span><button class="speak-btn" id="speakF" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;">'+spkSVG(12)+'</button></div></div></div>';
    }
    speak(q.speakText);
    var sf=document.getElementById('speakF'); if(sf) sf.addEventListener('click', function(e){ e.stopPropagation(); speak(q.speakText); });

    var feynmanHTML = '';
    if(q.feynman){
      feynmanHTML = '<div id="feynman" class="fadeUp" style="margin-top:10px;background:var(--blue-soft);border:1px solid var(--blue);border-radius:12px;padding:10px 12px;text-align:center;">'
        +'<div style="font-size:12px;font-weight:600;color:var(--blue);margin-bottom:7px;">Gesetz 4 · Can you explain why? (source closed)</div>'
        +'<div style="display:flex;gap:8px;justify-content:center;">'
        +'<button id="fyYes" style="flex:1;max-width:140px;padding:8px;border-radius:10px;background:var(--good);color:#fff;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;">Ja, kann ich</button>'
        +'<button id="fyNo" style="flex:1;max-width:140px;padding:8px;border-radius:10px;background:var(--card);color:var(--bad);border:1px solid var(--bad);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;">Noch nicht</button></div></div>';
    }

    var last=cur.idx>=m.count-1;
    var nb=document.createElement('button');
    nb.textContent=last?'Finish mission':'Next';
    nb.className='fadeUp';
    nb.style.cssText='margin-top:10px;width:100%;padding:13px;border-radius:14px;background:'+m.color+';color:#fff;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;';
    nb.addEventListener('click', function(){ cur.idx++; if(last){ finishMission(); } else { renderQ(); } });
    fb.insertAdjacentHTML('beforeend', feynmanHTML);
    fb.appendChild(nb);

    if(q.feynman){
      document.getElementById('fyYes').addEventListener('click', function(){ var f=document.getElementById('feynman'); f.innerHTML='<div style="font-size:13px;font-weight:600;color:var(--good);padding:4px 0;">Super — solid chunk!</div>'; });
      document.getElementById('fyNo').addEventListener('click', function(){
        cur.mistakes.push(q.recap);
        gradeCard(q.recap.q, q.recap.correct, 2);
        save();
        var f=document.getElementById('feynman'); f.innerHTML='<div style="font-size:13px;font-weight:600;color:var(--bad);padding:4px 0;">Added to SM-2 review — that gap is exactly what to fix.</div>';
      });
    }
  }

  function finishMission(){
    clearTimer();
    sndFinish();
    var m=MISSIONS[cur.key];
    var acc=Math.round((cur.correct/m.count)*100);
    var stars=acc>=90?3:acc>=70?2:1;
    S.xp+=cur.xpEarned;
    var today=todayStr();
    if(S.lastDay!==today){ if(S.lastDay && daysBetween(S.lastDay,today)===1){ S.streak++; } else { S.streak=1; } S.lastDay=today; }
    if(!S.done[today]) S.done[today]={};
    var prevStars=S.stars[today+'_'+cur.key]||0;
    S.stars[today+'_'+cur.key]=Math.max(prevStars, stars);
    S.done[today][cur.key]=true;
    save();

    var starsHTML=''; for(var i=0;i<3;i++){ starsHTML+='<span class="star earned" style="display:inline-block;">'+starSVG(i<stars?'var(--accent2)':'#cbd5e1')+'</span>'; }
    var doneCount=MISSION_ORDER.filter(function(k){ return (S.done[today]||{})[k]; }).length;

    app.innerHTML=
      '<div class="fadeUp" style="text-align:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 20px;box-shadow:0 2px 12px rgba(0,0,0,.05);border-top:4px solid '+m.color+';">'
      +'<div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;">'+m.law+' · Mission complete</div>'
      +'<h2 style="font-size:22px;font-weight:700;margin:0 0 10px;">'+m.name+' geschafft!</h2>'
      +'<div style="display:flex;justify-content:center;gap:10px;margin-bottom:16px;">'+starsHTML+'</div>'
      +'<div style="display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;">'
      +'<div style="flex:1 1 75px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;"><div style="font-size:20px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;">+'+cur.xpEarned+'</div><div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);">XP</div></div>'
      +'<div style="flex:1 1 75px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;"><div style="font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;">'+acc+'%</div><div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);">Accuracy</div></div>'
      +'<div style="flex:1 1 75px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;"><div style="font-size:20px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;">'+Object.keys(S.cards).length+'</div><div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);">Cards</div></div></div>'
      +(doneCount===N_MISSIONS?'<div class="newbest" style="background:var(--accent2-soft);border:1px solid var(--accent2);color:var(--accent2);padding:9px 12px;border-radius:12px;font-weight:600;font-size:13px;margin-bottom:14px;">Daily goal complete! Bis morgen. '+flameSVG()+'</div>':'<div style="color:var(--muted);font-size:12.5px;margin-bottom:14px;">'+(N_MISSIONS-doneCount)+' mission(s) left today.</div>')
      +(cur.mistakes.length?('<div style="text-align:left;color:var(--muted);font-size:11.5px;margin-bottom:14px;">'+cur.mistakes.length+' item(s) scheduled by SM-2.</div>'):'')
      +'<button id="dashBtn" style="width:100%;padding:14px;border-radius:14px;background:'+m.color+';color:#fff;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:9px;">Back to dashboard</button>'
      +(doneCount<N_MISSIONS?'<button id="nextMission" style="width:100%;padding:12px;border-radius:14px;background:var(--card);color:var(--text);border:1px solid var(--border);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;">Do next mission</button>':'')
      +'</div>';

    document.getElementById('dashBtn').addEventListener('click', renderDashboard);
    var nm=document.getElementById('nextMission');
    if(nm) nm.addEventListener('click', function(){ var next=MISSION_ORDER.find(function(k){ return !(S.done[todayStr()]||{})[k]; }); startMission(next||'bild'); });
  }

  document.addEventListener('keydown', function(e){
    if(cur.answered && e.key==='Enter'){ var nb=document.querySelector('#feedback button:last-child'); if(nb && /(Next|Finish)/.test(nb.textContent)) nb.click(); return; }
    if(!cur.answered && q && q.type==='mc' && document.activeElement.tagName!=='INPUT'){
      var n=parseInt(e.key,10); if(n>=1 && n<=q.options.length){ var b=document.querySelectorAll('.opt-btn'); if(b[n-1]) b[n-1].click(); }
    }
  });

  renderDashboard();
})();
</script>
</html>
