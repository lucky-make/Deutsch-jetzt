<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day Vocal Command Training</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a08;
    --surface: #111110;
    --card: #161614;
    --border: #2a2a26;
    --accent: #c8a96e;
    --accent2: #7eb8a4;
    --accent3: #c97b6e;
    --text: #e8e4dc;
    --muted: #7a7870;
    --pause-color: #c8a96e;
    --pace-color: #7eb8a4;
    --pitch-color: #a87ec8;
    --rhythm-color: #c97b6e;
    --emphasis-color: #7ea8c8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  header {
    padding: 60px 24px 40px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .week-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    line-height: 1.05;
    color: var(--text);
  }

  h1 span {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* Week sections */
  .week-section {
    border-bottom: 1px solid var(--border);
  }

  .week-header {
    padding: 24px;
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  .week-header:hover { background: var(--card); }

  .week-number {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 900;
    color: var(--border);
    line-height: 1;
    font-style: italic;
  }

  .week-info h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .week-info p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .week-toggle {
    margin-left: auto;
    color: var(--accent);
    font-size: 20px;
    transition: transform 0.3s;
  }

  .week-toggle.open { transform: rotate(180deg); }

  .week-days {
    display: none;
    padding: 0 24px 24px;
  }

  .week-days.open { display: block; }

  /* Day card */
  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-top: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .day-card:hover { border-color: var(--accent); }

  .day-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .day-number {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    min-width: 48px;
    font-style: italic;
  }

  .day-title {
    flex: 1;
  }

  .day-title h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .day-focus {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .focus-tag {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid;
  }

  .tag-pause { color: var(--pause-color); border-color: var(--pause-color); }
  .tag-pace { color: var(--pace-color); border-color: var(--pace-color); }
  .tag-pitch { color: var(--pitch-color); border-color: var(--pitch-color); }
  .tag-rhythm { color: var(--rhythm-color); border-color: var(--rhythm-color); }
  .tag-emphasis { color: var(--emphasis-color); border-color: var(--emphasis-color); }

  .day-content {
    padding: 20px;
    display: none;
  }

  .day-content.open { display: block; }

  .section-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 20px;
  }

  .section-label:first-child { margin-top: 0; }

  .drill-box {
    background: var(--surface);
    border-left: 2px solid var(--accent);
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .script-box {
    background: #0d0d0b;
    border: 1px solid var(--border);
    padding: 20px;
    font-family: 'Libre Baskerville', serif;
    font-size: 14px;
    line-height: 2;
    color: var(--text);
    position: relative;
  }

  /* Inline annotation styles */
  .p { color: var(--pause-color); font-family: 'IBM Plex Mono', monospace; font-size: 10px; vertical-align: super; }
  .pc { color: var(--pace-color); }
  .pi { color: var(--pitch-color); }
  .r { color: var(--rhythm-color); }
  .e { color: var(--emphasis-color); font-weight: bold; }

  .annotation-key {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .ann-item {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .day-chevron {
    color: var(--muted);
    font-size: 14px;
    transition: transform 0.3s;
  }

  .day-chevron.open { transform: rotate(180deg); color: var(--accent); }

  .progress-bar {
    height: 2px;
    background: var(--border);
    margin: 24px 0 0;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s ease;
  }

  footer {
    padding: 40px 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  @media (max-width: 480px) {
    .week-number { font-size: 36px; }
    .script-box { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="week-label">Lloyd — Vocal Command Protocol</div>
  <h1>30 Days to<br><span>Instinctive</span><br>Delivery</h1>
  <p class="subtitle">Pause · Pace · Pitch · Rhythm · Emphasis</p>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--pause-color)"></div> Pause [•]</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--pace-color)"></div> Pace (slow/fast)</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--pitch-color)"></div> Pitch ↓↑</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--rhythm-color)"></div> Rhythm ~</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--emphasis-color)"></div> <strong>Emphasis</strong></div>
</div>

<div id="app"></div>

<footer>
  Record every session. Listen back. That's the whole game.
</footer>

<script>
const days = [
  // WEEK 1 — Awareness + Pause
  {
    day: 1, title: "The Pause Awakening", focus: ["pause"],
    drill: "Read the script once normally. Then read it again, adding a 1-second stop before every bolded word. Record both. Compare.",
    script: `My name is Lloyd. <span class='p'>[•]</span> And I have decided <span class='p'>[•]</span> that the way I speak <span class='p'>[•]</span> will <span class='e'>never</span> be the same again. Every word I say from this point <span class='p'>[•]</span> carries weight. I choose <span class='p'>[•]</span> what lands. I choose <span class='p'>[•]</span> what stays.`
  },
  {
    day: 2, title: "Silence Is Not Empty", focus: ["pause"],
    drill: "Say the script out loud three times. Each round, make the pauses one beat longer. By round three, the silence should feel uncomfortable — that's the sweet spot.",
    script: `There is a version of me <span class='p'>[•]</span> that rushes. That fills every gap with noise. <span class='p'>[•]</span> That version <span class='p'>[•]</span> is done. When I speak now, <span class='p'>[•]</span> I let the silence do the work. <span class='p'>[•]</span> Because silence <span class='p'>[•]</span> is not emptiness. <span class='p'>[•]</span> It is <span class='e'>pressure</span>.`
  },
  {
    day: 3, title: "Pace Meets Pause", focus: ["pause", "pace"],
    drill: "The fast parts should feel almost rushed. The slow parts should feel like you're placing each word on a shelf. Practice the contrast specifically.",
    script: `<span class='pc'>(fast) I woke up, I made a decision, I sat down, I opened my mouth —</span> <span class='p'>[•]</span> and I <span class='e'>chose</span> to speak differently. <span class='pc'>(slow) From. This. Day. Forward.</span> <span class='p'>[•]</span> Not because someone told me to. <span class='p'>[•]</span> Because I decided it.`
  },
  {
    day: 4, title: "Pitch Drops", focus: ["pause", "pitch"],
    drill: "Every sentence in this script ends with a downward pitch. Practice until your voice physically drops at the end of each statement. Record it.",
    script: `I am not asking for permission <span class='pi'>↓</span>. I am not waiting for anyone to confirm what I already know <span class='pi'>↓</span>. <span class='p'>[•]</span> My voice is a tool <span class='pi'>↓</span>. And I am learning <span class='p'>[•]</span> to use it <span class='pi'>↓</span>. Every. Single. Day <span class='pi'>↓</span>.`
  },
  {
    day: 5, title: "Finding the Rhythm", focus: ["rhythm", "pause"],
    drill: "Read this like spoken word poetry. There's a beat underneath it. Tap your foot while you read to find the natural meter, then let your voice ride it.",
    script: `<span class='r'>I speak with intention, I move with precision,</span> <span class='p'>[•]</span> <span class='r'>I know what I carry, I know what I'm missing.</span> <span class='p'>[•]</span> Not performance — presence. Not volume — <span class='e'>weight</span>. <span class='p'>[•]</span> <span class='r'>The room doesn't need me louder. It needs me deliberate.</span>`
  },
  {
    day: 6, title: "Emphasis Surgery", focus: ["emphasis", "pause"],
    drill: "Say the script 5 times, emphasizing a different word each time. Notice how meaning shifts. Write down which version felt most powerful and why.",
    script: `I <span class='e'>choose</span> what I focus on. I choose <span class='e'>what</span> I focus on. I choose what <span class='e'>I</span> focus on. I choose what I <span class='e'>focus</span> on. <span class='p'>[•]</span> Same words. <span class='p'>[•]</span> Completely different <span class='e'>person</span>.`
  },
  {
    day: 7, title: "Week One Integration", focus: ["pause", "pace", "pitch", "rhythm", "emphasis"],
    drill: "All five tools active. Read slowly first to find the markings, then deliver it like it's real. This is your first full performance. Record it.",
    script: `<span class='pc'>(slow)</span> Seven days ago <span class='p'>[•]</span> I was the same person. <span class='pc'>(faster)</span> Same voice, same habits, same patterns running on autopilot. <span class='p'>[•]</span> <span class='pc'>(slow)</span> Not anymore <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='r'>I trained my mouth. I trained my breath. I trained the pause.</span> <span class='p'>[•]</span> And in the next <span class='e'>twenty-three days</span> <span class='p'>[•]</span> this becomes <span class='pi'>↓</span> who I am <span class='pi'>↓</span>.`
  },

  // WEEK 2 — Pace + Pitch deepening
  {
    day: 8, title: "The Speed Map", focus: ["pace"],
    drill: "Mark each sentence: fast, medium, or slow. Then deliver accordingly. No two consecutive sentences should be the same speed.",
    script: `<span class='pc'>(fast)</span> I have a plan, I know the steps, I know the timeline. <span class='p'>[•]</span> <span class='pc'>(slow)</span> Germany is not a dream. It is a destination <span class='pi'>↓</span>. <span class='pc'>(medium)</span> I am moving through the work, steadily, without panic. <span class='p'>[•]</span> <span class='pc'>(slow)</span> And when I arrive <span class='p'>[•]</span> nobody will be <span class='e'>surprised</span> except the people who underestimated me <span class='pi'>↓</span>.`
  },
  {
    day: 9, title: "Pitch Control", focus: ["pitch", "pause"],
    drill: "Statements go down. Questions go up. Practice reading this script and making your pitch shifts physically obvious. Exaggerate first, then refine.",
    script: `What do I want <span class='pi'>↑</span>? <span class='p'>[•]</span> I want to be heard <span class='pi'>↓</span>. Not just listened to — <span class='e'>heard</span> <span class='pi'>↓</span>. <span class='p'>[•]</span> Is that too much to ask <span class='pi'>↑</span>? <span class='p'>[•]</span> No <span class='pi'>↓</span>. It is the <span class='e'>minimum</span> I will accept <span class='pi'>↓</span>.`
  },
  {
    day: 10, title: "Rhythm Intensified", focus: ["rhythm", "emphasis"],
    drill: "Read this like a preacher hitting a pulpit rhythm. There should be a heartbeat underneath every line. Tap or clap the beat first, then speak into it.",
    script: `<span class='r'>I don't stop when it's hard. I don't stop when it's slow.</span> <span class='p'>[•]</span> <span class='r'>I don't stop when nobody's watching and nobody would know.</span> <span class='p'>[•]</span> Because this is not for <span class='e'>them</span>. <span class='p'>[•]</span> <span class='r'>This is mine. All of it. Every hour, every word, every line.</span>`
  },
  {
    day: 11, title: "Conversational Pace", focus: ["pace", "pitch", "pause"],
    drill: "Pretend you're telling a friend something that happened. The pace should feel natural but controlled. Not a performance — a conversation with intention.",
    script: `So I was thinking <span class='pc'>(slow)</span> about what I actually want my voice to do for me. <span class='p'>[•]</span> And I realized <span class='p'>[•]</span> <span class='pc'>(fast)</span> most people speak and hope someone listens — <span class='pc'>(slow)</span> I want to speak and <span class='e'>know</span> they're listening <span class='pi'>↓</span>. <span class='p'>[•]</span> That's a completely different relationship with the room <span class='pi'>↓</span>.`
  },
  {
    day: 12, title: "The Question Weapon", focus: ["pitch", "pause", "emphasis"],
    drill: "Rhetorical questions are one of the most powerful vocal tools. Practice asking questions you don't expect an answer to — and then answering them yourself with full authority.",
    script: `Who decides what's possible <span class='pi'>↑</span>? <span class='p'>[•]</span> I do <span class='pi'>↓</span>. <span class='p'>[•]</span> Who decides how far this goes <span class='pi'>↑</span>? <span class='p'>[•]</span> <span class='e'>I</span> do <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='pc'>(fast)</span> Not the circumstances, not the country I was born in, not the system — <span class='p'>[•]</span> <span class='pc'>(slow)</span> <span class='e'>me</span> <span class='pi'>↓</span>.`
  },
  {
    day: 13, title: "Storytelling Mode", focus: ["pace", "rhythm", "pause"],
    drill: "This is a mini story. Build tension as you go. Start slow and measured, increase pace through the middle, then land the ending slowly and with full weight.",
    script: `<span class='pc'>(slow)</span> There was a point where I didn't know if this was going to work. <span class='p'>[•]</span> <span class='pc'>(faster)</span> Where the doubt was louder than the plan, where the distance felt like a wall and not a road. <span class='p'>[•]</span> <span class='pc'>(slow)</span> And then I made a choice <span class='p'>[•]</span> to keep <span class='e'>going anyway</span> <span class='pi'>↓</span>.`
  },
  {
    day: 14, title: "Week Two Performance", focus: ["pause", "pace", "pitch", "rhythm", "emphasis"],
    drill: "Two weeks in. This is your benchmark recording. Deliver this like you're addressing someone who needs to believe you. Everything active.",
    script: `<span class='pc'>(slow)</span> Two weeks <span class='p'>[•]</span>. That is how long I have been doing this. <span class='pc'>(medium)</span> And I can already hear the difference — in my pauses, in my pitch, in the way a sentence <span class='e'>lands</span>. <span class='p'>[•]</span> <span class='r'><span class='pc'>(faster)</span> This is not talent. This is training. This is repetition. This is refusing to sound like I used to.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> Fourteen days down <span class='pi'>↓</span>. <span class='p'>[•]</span> Sixteen to go <span class='pi'>↓</span>.`
  },

  // WEEK 3 — Integration + Real stakes
  {
    day: 15, title: "The Mirror Session", focus: ["pause", "pitch", "emphasis"],
    drill: "Do this one in front of a mirror. Watch your face. Make sure your expression matches the weight of what you're saying. Vocal delivery and facial delivery are one thing.",
    script: `I see someone <span class='p'>[•]</span> who is building something real. <span class='p'>[•]</span> Not performing ambition — <span class='e'>executing</span> it <span class='pi'>↓</span>. <span class='p'>[•]</span> The face in this mirror <span class='p'>[•]</span> belongs to someone who will be in Germany <span class='p'>[•]</span> doing what others said was too complicated <span class='pi'>↓</span>. <span class='p'>[•]</span> I see it clearly <span class='pi'>↓</span>.`
  },
  {
    day: 16, title: "Controlled Urgency", focus: ["pace", "rhythm", "pause"],
    drill: "Urgent but not panicked. Fast but not sloppy. Practice the feeling of having something important to say and choosing to say it at the right speed.",
    script: `<span class='pc'>(medium-fast)</span> <span class='r'>Listen. There's something I need you to understand about where this is going.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> This is not guesswork. <span class='p'>[•]</span> This is not hope. <span class='p'>[•]</span> <span class='pc'>(medium-fast)</span> <span class='r'>I have the plan, I have the timeline, I have the will to execute it.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> What I don't have <span class='p'>[•]</span> is <span class='e'>time to waste</span> <span class='pi'>↓</span>.`
  },
  {
    day: 17, title: "Authority Baseline", focus: ["pitch", "pause", "emphasis"],
    drill: "This is how you speak when you want someone to trust your competence without performing confidence. Grounded. Measured. No decoration.",
    script: `I've assessed the situation <span class='pi'>↓</span>. <span class='p'>[•]</span> I know what's required <span class='pi'>↓</span>. <span class='p'>[•]</span> The Ausbildung pathway is specific: <span class='e'>B2 German</span>, <span class='p'>[•]</span> a strong application, <span class='p'>[•]</span> and the right company. <span class='p'>[•]</span> I am working on all three simultaneously <span class='pi'>↓</span>. <span class='p'>[•]</span> There is no version of this <span class='p'>[•]</span> where I don't get there <span class='pi'>↓</span>.`
  },
  {
    day: 18, title: "Emotional Range", focus: ["pace", "pitch", "rhythm"],
    drill: "This script moves through different emotional registers. Let your voice change with it — not dramatically, but honestly. Monotone is the enemy.",
    script: `<span class='pc'>(slow, heavy)</span> Some days the distance feels enormous. <span class='p'>[•]</span> <span class='pc'>(medium)</span> Lagos to Germany is not just kilometers — it's paperwork and exams and waiting and proving yourself to systems that don't know your name. <span class='p'>[•]</span> <span class='pc'>(slow, resolute)</span> And then I remember <span class='p'>[•]</span> I've been in harder rooms than this <span class='pi'>↓</span>. <span class='p'>[•]</span> And I walked out of <span class='e'>all of them</span> <span class='pi'>↓</span>.`
  },
  {
    day: 19, title: "Interview Simulation", focus: ["pause", "pace", "pitch"],
    drill: "Pretend a German interviewer just asked you why they should accept your application. This is your answer. Deliver it like you've said it a hundred times but it still matters.",
    script: `<span class='pc'>(measured)</span> I am precise, I am self-directed, and I learn fast <span class='pi'>↓</span>. <span class='p'>[•]</span> I have spent the last year building systems and tools to solve real problems <span class='p'>[•]</span> — not because someone assigned them, <span class='p'>[•]</span> because I identified a gap and closed it <span class='pi'>↓</span>. <span class='p'>[•]</span> That is what I will bring to your company <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='e'>Every single day</span> <span class='pi'>↓</span>.`
  },
  {
    day: 20, title: "Silence as Power", focus: ["pause", "emphasis"],
    drill: "Today the drill is about what you DON'T say. The pauses in this script are longer — 2 full seconds each. Do not rush them. Sit in them. That discomfort is the training.",
    script: `I could fill this silence. <span class='p'>[• •]</span> I choose not to. <span class='p'>[• •]</span> Because the pause <span class='p'>[•]</span> is where the other person decides whether they <span class='e'>trust</span> you. <span class='p'>[• •]</span> And I have learned <span class='p'>[•]</span> to let them sit in that <span class='p'>[• •]</span> until they do <span class='pi'>↓</span>.`
  },
  {
    day: 21, title: "Week Three Benchmark", focus: ["pause", "pace", "pitch", "rhythm", "emphasis"],
    drill: "Compare this recording to Day 7 and Day 14. The improvement should be audible. If it's not, identify specifically which tool is still weak.",
    script: `<span class='pc'>(slow)</span> Three weeks <span class='p'>[•]</span>. <span class='pc'>(medium-fast)</span> <span class='r'>I've recorded my voice, I've listened back, I've heard what was wrong and fixed it.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> The pause is natural now <span class='pi'>↓</span>. The pitch drops without effort <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='r'><span class='pc'>(medium)</span> The rhythm moves underneath my words like something I was always carrying.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> Nine days left <span class='p'>[•]</span> to make this <span class='e'>permanent</span> <span class='pi'>↓</span>.`
  },

  // WEEK 4 — Instinct + Real world
  {
    day: 22, title: "No Script", focus: ["pause", "pace", "pitch", "rhythm", "emphasis"],
    drill: "Today there is no script. Speak for 60 seconds about your plan to get to Germany — no notes, no prep. Record it. Then listen and annotate which tools you used naturally and which ones disappeared under pressure.",
    script: `<em style="color:var(--muted)">No script today. Open your mouth. Talk about Germany for 60 seconds. Record it. That's the drill.</em>`
  },
  {
    day: 23, title: "Real Conversation Target", focus: ["pause", "pitch", "emphasis"],
    drill: "Today you deploy in the real world. One real conversation — with a parent, a stranger, anyone — where you consciously use pause and pitch drop. No announcement. Just do it.",
    script: `<span class='pc'>(prep script — say this before the conversation)</span> <span class='p'>[•]</span> I am going into this interaction with intention. <span class='p'>[•]</span> I will pause before I answer. <span class='p'>[•]</span> I will drop my pitch at the end of my statements. <span class='p'>[•]</span> I will emphasize <span class='e'>one</span> thing per sentence. <span class='p'>[•]</span> Go <span class='pi'>↓</span>.`
  },
  {
    day: 24, title: "Speed Variance Mastery", focus: ["pace", "rhythm"],
    drill: "The drill today is pure pace contrast. Read the fast sections at maximum natural speed. Read the slow sections at half your normal pace. No middle ground.",
    script: `<span class='pc'>(fast)</span> <span class='r'>I've been grinding through vocabulary and grammar and listening drills and speaking practice and building tools and writing outlines —</span> <span class='p'>[•]</span> <span class='pc'>(very slow)</span> and it is <span class='p'>[•]</span> working <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='pc'>(slow)</span> Not because I'm exceptional. <span class='p'>[•]</span> Because I <span class='e'>showed up</span> <span class='pi'>↓</span>.`
  },
  {
    day: 25, title: "The Pitch Ladder", focus: ["pitch", "pause"],
    drill: "Practice this script three times. First: all flat delivery. Second: pitch drops only on the marked words. Third: full pitch control including rises on questions. Compare all three.",
    script: `Do you know what changes when you control your voice <span class='pi'>↑</span>? <span class='p'>[•]</span> Everything <span class='pi'>↓</span>. <span class='p'>[•]</span> The way people listen <span class='pi'>↓</span>. The way rooms respond <span class='pi'>↓</span>. The way <span class='e'>you</span> feel when you're speaking <span class='pi'>↓</span>. <span class='p'>[•]</span> One tool. <span class='p'>[•]</span> Infinite <span class='e'>leverage</span> <span class='pi'>↓</span>.`
  },
  {
    day: 26, title: "Rhythm Without Rhyme", focus: ["rhythm", "pace", "pause"],
    drill: "Rhythm doesn't mean poetry. It means cadence. Practice feeling the natural meter of prose — where the stresses fall, where the breath goes. Read this slowly first, mark the beats, then deliver.",
    script: `<span class='r'>I am not the same person I was at the start of this month.</span> <span class='p'>[•]</span> <span class='r'>My mouth has learned something my brain already knew.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> And the gap between knowing and <span class='e'>doing</span> <span class='p'>[•]</span> is closing <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='r'>Day by day. Word by word. Pause by deliberate pause.</span>`
  },
  {
    day: 27, title: "High Stakes Simulation", focus: ["pause", "pace", "pitch", "emphasis"],
    drill: "Pretend this is a real Ausbildung interview. You are being evaluated. Nerves are real. Use the tools specifically because of the pressure, not despite it.",
    script: `<span class='pc'>(measured, confident)</span> My name is Lloyd <span class='pi'>↓</span>. <span class='p'>[•]</span> I am applying for the Fachinformatiker Ausbildung <span class='p'>[•]</span> because I have already been building in this field independently <span class='pi'>↓</span>. <span class='p'>[•]</span> I learn by doing. I solve by building. <span class='p'>[•]</span> And I bring <span class='e'>full commitment</span> <span class='p'>[•]</span> to every system I touch <span class='pi'>↓</span>.`
  },
  {
    day: 28, title: "The Quiet Authority", focus: ["pause", "pitch", "pace"],
    drill: "This script should be delivered almost quietly. Low volume, low pitch, slow pace. Real authority doesn't need to be loud. Practice commanding attention by pulling back instead of pushing forward.",
    script: `<span class='pc'>(quiet, slow)</span> I don't need to be the loudest person in the room <span class='pi'>↓</span>. <span class='p'>[•]</span> I need to be the one <span class='p'>[•]</span> people can't stop listening to <span class='pi'>↓</span>. <span class='p'>[•]</span> There is a difference <span class='p'>[•]</span> between volume <span class='p'>[•]</span> and <span class='e'>presence</span> <span class='pi'>↓</span>. <span class='p'>[•]</span> I have chosen <span class='p'>[•]</span> presence <span class='pi'>↓</span>.`
  },
  {
    day: 29, title: "Full Integration — Final Rehearsal", focus: ["pause", "pace", "pitch", "rhythm", "emphasis"],
    drill: "This is your penultimate session. Every tool should now feel like reaching for something familiar. Deliver this like someone who has been training for 29 days — because you have.",
    script: `<span class='pc'>(slow)</span> Tomorrow is the last day <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='pc'>(medium)</span> <span class='r'>Twenty-nine sessions. Twenty-nine recordings. Twenty-nine times I sat down and did the work.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> And the voice I have now <span class='p'>[•]</span> is not the voice I started with <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='pc'>(medium-fast)</span> <span class='r'>The pause is mine. The pitch is mine. The rhythm, the pace, the emphasis — mine.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> One more day <span class='p'>[•]</span> to seal it <span class='pi'>↓</span>.`
  },
  {
    day: 30, title: "Day 30 — Who You Are Now", focus: ["pause", "pace", "pitch", "rhythm", "emphasis"],
    drill: "Final recording. Then go back and listen to Day 1. That gap — that audible distance between who you were and who you are — that is the work. Keep it. Build on it.",
    script: `<span class='pc'>(slow, full weight)</span> Thirty days ago <span class='p'>[•]</span> I made a decision. <span class='p'>[•]</span> <span class='pc'>(medium)</span> <span class='r'>I decided that the way I speak would reflect the kind of person I'm becoming — precise, intentional, impossible to ignore.</span> <span class='p'>[•]</span> <span class='pc'>(slow)</span> This is not the end of the training <span class='pi'>↓</span>. <span class='p'>[•]</span> This is the end of the beginning <span class='pi'>↓</span>. <span class='p'>[•]</span> <span class='pc'>(very slow)</span> <span class='e'>Lloyd</span> <span class='p'>[•]</span> speaks like this now <span class='pi'>↓</span>.`
  }
];

const weeks = [
  { num: 1, title: "Awareness", sub: "Learning to hear what you're doing — Days 1 to 7", days: days.slice(0,7) },
  { num: 2, title: "Deepening", sub: "Pushing each tool further — Days 8 to 14", days: days.slice(7,14) },
  { num: 3, title: "Integration", sub: "All five tools, simultaneously — Days 15 to 21", days: days.slice(14,21) },
  { num: 4, title: "Instinct", sub: "Real pressure, real world — Days 22 to 30", days: days.slice(21) }
];

const tagMap = {
  pause: "tag-pause", pace: "tag-pace", pitch: "tag-pitch", rhythm: "tag-rhythm", emphasis: "tag-emphasis"
};

const app = document.getElementById('app');

weeks.forEach((week, wi) => {
  const section = document.createElement('div');
  section.className = 'week-section';

  const header = document.createElement('div');
  header.className = 'week-header';
  header.innerHTML = `
    <div class="week-number">0${week.num}</div>
    <div class="week-info">
      <h2>${week.title}</h2>
      <p>${week.sub}</p>
    </div>
    <div class="week-toggle" id="wt${wi}">▾</div>
  `;

  const daysDiv = document.createElement('div');
  daysDiv.className = 'week-days';
  daysDiv.id = `week-${wi}`;

  week.days.forEach((d, di) => {
    const card = document.createElement('div');
    card.className = 'day-card';

    const tags = d.focus.map(f => `<span class="focus-tag ${tagMap[f]}">${f}</span>`).join('');

    card.innerHTML = `
      <div class="day-header" onclick="toggleDay(this)">
        <div class="day-number">${d.day}</div>
        <div class="day-title">
          <h3>${d.title}</h3>
          <div class="day-focus">${tags}</div>
        </div>
        <div class="day-chevron">▾</div>
      </div>
      <div class="day-content">
        <div class="section-label">Today's Drill</div>
        <div class="drill-box">${d.drill}</div>
        <div class="section-label">Practice Script</div>
        <div class="script-box">${d.script}
          <div class="annotation-key">
            <span class="ann-item"><span style="color:var(--pause-color)">[•]</span> pause</span>
            <span class="ann-item"><span style="color:var(--pace-color)">(fast/slow)</span> pace</span>
            <span class="ann-item"><span style="color:var(--pitch-color)">↓↑</span> pitch</span>
            <span class="ann-item"><span style="color:var(--rhythm-color)">~rhythm~</span></span>
            <span class="ann-item"><span style="color:var(--emphasis-color);font-weight:bold">bold</span> emphasis</span>
          </div>
        </div>
      </div>
    `;
    daysDiv.appendChild(card);
  });

  header.addEventListener('click', () => {
    const toggle = document.getElementById(`wt${wi}`);
    const days = document.getElementById(`week-${wi}`);
    const isOpen = days.classList.contains('open');
    days.classList.toggle('open', !isOpen);
    toggle.classList.toggle('open', !isOpen);
  });

  section.appendChild(header);
  section.appendChild(daysDiv);
  app.appendChild(section);
});

function toggleDay(header) {
  const content = header.nextElementSibling;
  const chevron = header.querySelector('.day-chevron');
  const isOpen = content.classList.contains('open');
  content.classList.toggle('open', !isOpen);
  chevron.classList.toggle('open', !isOpen);
}

// Open week 1 by default
document.getElementById('week-0').classList.add('open');
document.getElementById('wt0').classList.add('open');
</script>
</body>
</html>
